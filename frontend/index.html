<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Caminho relativo: o Vite empacota o ícone e reescreve o href respeitando `base: './'`. -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./src/global/images/vagoo-favicon-32.png"
    />
    <link rel="apple-touch-icon" href="./src/global/images/vagoo-favicon-180.png" />
    <title>Vagoo</title>
    <!--
      Aplica o tema antes do primeiro desenho, para a tela não piscar clara no modo escuro.
      Lê a mesma chave do store do zustand (`THEME_STORAGE_KEY` em src/lib/theme.ts) — mudou lá,
      mude aqui. Depois que o React monta, quem cuida da classe é o `useApplyTheme`.
    -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          var saved = JSON.parse(localStorage.getItem('vagoo-theme') || 'null')
          if (saved && saved.state && saved.state.theme) theme = saved.state.theme
        } catch (error) {}
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
