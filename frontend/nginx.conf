# Uma origem só: o site e, atrás dele, a API (/api/) e a mídia (/media/). É o que a demonstração pública expõe pelo
# Cloudflare Tunnel (docs/operacao/demo-publica.md): sem CORS e sem localhost no navegador.

# Os cabeçalhos abaixo são do site. Na API e na mídia, vazio: o nginx não põe o cabeçalho (add_header com valor
# vazio não sai), e valem só os que a API manda, sem duplicar.
map $uri $is_site {
    ~^/(api|media)/  0;
    default          1;
}

# Cache: arquivos com hash no nome (/assets/) para sempre; todo o resto (index.html, ícones sem hash) sempre
# revalidado, senão uma versão nova não chega ao navegador.
map $uri $static_cache_control {
    ~^/(api|media)/  "";
    ~^/assets/       "public, max-age=31536000, immutable";
    default          "no-cache";
}

# CSP do site. Tudo da mesma origem (a API inclusive, pelo proxy abaixo). O hash é o do <script> inline do
# index.html que aplica o tema antes do primeiro desenho: mudou o script, mude o hash (o teste
# src/api/base/same-origin.test.ts confere). style-src aceita inline porque bibliotecas de UI injetam <style>.
map $is_site $site_csp {
    0                "";
    default          "default-src 'self'; script-src 'self' 'sha256-gOlA7RcrxCify6viJHDS98yi2MPy6KSEY2+VLe/n2GY='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

# O TLS termina na Cloudflare: quem diz que a origem era HTTPS é o X-Forwarded-Proto do cloudflared. Acesso local
# direto (sem o cabeçalho) segue como http.
map $http_x_forwarded_proto $forwarded_proto {
    default  $http_x_forwarded_proto;
    ""       $scheme;
}

map "$is_site:$forwarded_proto" $site_hsts {
    "1:https"  "max-age=31536000";
    default    "";
}

map $is_site $site_nosniff {
    0        "";
    default  "nosniff";
}

map $is_site $site_referrer_policy {
    0        "";
    default  "same-origin";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # O envio de imagem aceita até 5 MB de arquivo (mais o envelope do multipart); o padrão do nginx é 1 MB.
    client_max_body_size 6m;

    add_header Cache-Control $static_cache_control always;
    add_header Content-Security-Policy $site_csp always;
    add_header Strict-Transport-Security $site_hsts always;
    add_header X-Content-Type-Options $site_nosniff always;
    add_header Referrer-Policy $site_referrer_policy always;

    # O app usa HashRouter: toda rota é servida pelo index.html na raiz.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # A saúde da API mora em /health; daqui, /api/health, para conferir a API pelo mesmo endereço público.
    location = /api/health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /media/ {
        proxy_pass http://api:8080/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
