server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # O app usa HashRouter: toda rota é servida pelo index.html na raiz.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos com hash no nome podem ficar em cache para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca em cache: senão uma versão nova não chega ao navegador.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
