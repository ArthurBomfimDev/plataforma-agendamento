name: frontend

# SEM filtro de caminho no gatilho — de propósito. Ver o cabeçalho de backend-ci.yml:
# check obrigatório com filtro de caminho bloqueia para sempre PR que não toca a área.
# O job `changes` decide; quando o frontend não mudou, build-lint é pulado e reporta sucesso.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: frontend / changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detectar mudanças no frontend
        id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$PUSH_AFTER"
          fi

          if [ -z "$base" ] \
             || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Sem base comparável (primeiro push ou histórico reescrito) — tratando como alterado."
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base" "$head")"
          echo "Arquivos alterados:"; echo "$changed" | sed 's/^/  /'

          if echo "$changed" | grep -qE '^(frontend/|\.github/workflows/frontend-ci\.yml$)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Frontend não alterado — build-lint será pulado (reporta sucesso)."
          fi

  build-lint:
    # Nome estável: é check obrigatório na proteção da main.
    name: frontend / build-lint
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Detectar app do frontend
        id: detect
        working-directory: .
        shell: bash
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package.json ainda não existe. Bootstrap em andamento."
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.found == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        if: steps.detect.outputs.found == 'true'
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.found == 'true'
        run: npm run lint

      - name: Verificação de tipos
        if: steps.detect.outputs.found == 'true'
        run: npm run typecheck

      - name: Verificar formatação
        if: steps.detect.outputs.found == 'true'
        run: npm run format:check

      - name: Testes
        if: steps.detect.outputs.found == 'true'
        run: npm run test -- --run

      - name: Build
        if: steps.detect.outputs.found == 'true'
        run: npm run build
