name: frontend

# SEM filtro de caminho no gatilho — de propósito. Ver o cabeçalho de backend-ci.yml:
# check obrigatório com filtro de caminho bloqueia para sempre PR que não toca a área.
# O job `changes` decide; quando o frontend não mudou, build-lint é pulado e reporta sucesso.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: frontend / changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detectar mudanças no frontend
        id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$PUSH_AFTER"
          fi

          if [ -z "$base" ] \
             || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Sem base comparável (primeiro push ou histórico reescrito) — tratando como alterado."
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base" "$head")"
          echo "Arquivos alterados:"; echo "$changed" | sed 's/^/  /'

          if echo "$changed" | grep -qE '^(frontend/|\.github/workflows/frontend-ci\.yml$)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Frontend não alterado — build-lint será pulado (reporta sucesso)."
          fi

  build-lint:
    # Nome estável: é check obrigatório na proteção da main. NÃO renomear — mudar este nome
    # trava todo PR até a regra de proteção ser reconfigurada.
    name: frontend / build-lint
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      # Bun é gerenciador de pacotes e executor de scripts. O bundler continua sendo o Vite
      # (ADR-011). A versão vem de frontend/.bun-version, para o CI e as duas máquinas baterem.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/.bun-version

      # --frozen-lockfile é o equivalente do `npm ci`: falha se o bun.lock estiver desatualizado
      # em relação ao package.json, em vez de atualizá-lo em silêncio.
      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Verificação de tipos
        run: bun run typecheck

      - name: Verificar formatação
        run: bun run format:check

      - name: Testes
        run: bun run test

      - name: Build
        run: bun run build
