name: governance

# Reprova PR que contenha commit com trailer de atribuição de IA.
#
# O hook `.githooks/commit-msg` remove esses trailers, mas só na máquina de quem rodou
# `git config core.hooksPath .githooks`. Quem clonar e esquecer o comando traz o trailer
# de volta, e o GitHub passa a listar a IA como Contributor do repositório — que não sai
# nem reescrevendo o histórico, porque o GitHub guarda os commits antigos e a contagem
# em cache. Este check é a única proteção que não depende da configuração local.
#
# Motivo de fundo: este é um TCC e a autoria precisa ser inequívoca. Ver CLAUDE.md §5.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-ai-coauthor:
    # Nome estável: é check obrigatório na proteção da main.
    name: governance / no-ai-coauthor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verificar trailers de atribuição de IA
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # MESMO padrão do .githooks/commit-msg — mantenha os dois iguais.
          # Estreito de propósito: não pode casar `Claudete` nem `Claudio`.
          AI_ATTRIBUTION='^[[:space:]]*co-authored-by:.*@anthropic\.com|^[[:space:]]*co-authored-by:[[:space:]]*claude[[:space:]]*(<|$)|^[[:space:]]*co-authored-by:[[:space:]]*claude[[:space:]]+(opus|sonnet|haiku|fable)([[:space:]]|$)|^[[:space:]]*claude-session:|generated with \[claude code\]'

          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] \
               && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            # Primeiro push ou histórico reescrito: verifica tudo.
            range="$PUSH_AFTER"
          fi

          echo "Verificando: $range"
          found=0
          for sha in $(git rev-list "$range"); do
            if git log -1 --format=%B "$sha" | grep -qiE "$AI_ATTRIBUTION"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") — contém trailer de atribuição de IA."
              git log -1 --format=%B "$sha" | grep -iE "$AI_ATTRIBUTION" | sed 's/^/    /'
              found=1
            fi
          done

          if [ "$found" -eq 1 ]; then
            echo ""
            echo "Como corrigir:"
            echo "  1. git config core.hooksPath .githooks     (evita que se repita)"
            echo "  2. git rebase -i origin/main                (marque os commits com 'reword')"
            echo "  3. remova as linhas acima de cada mensagem e salve"
            echo "  4. git push --force-with-lease"
            exit 1
          fi

          echo "Nenhum trailer de atribuição de IA."
